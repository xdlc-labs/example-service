apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-example-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/xdlc-labs/example-service.git
    targetRevision: main
    path: deploy
    helm:
      valueFiles:
        - ../gitops/values/prod/example-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
